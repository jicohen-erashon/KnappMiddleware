<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KnappMiddleware · Iniciar sesión</title>
<link rel="stylesheet" href="vendor/fluent/tokens.css">
<script type="module" src="vendor/fluent/web-components.min.js"></script>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

<main class="login-wrap">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17V10l4-5 4 5v7"/>
          <path d="M12 17v-4l4-5 4 5v4"/>
        </svg>
      </span>
      <span class="brand-text">KnappMiddleware <small>panel administrativo</small></span>
    </div>
    <h1>Iniciar sesión</h1>

    <div class="field">
      <label for="loginUser">Usuario</label>
      <fluent-text-input id="loginUser" name="username" type="text" autocomplete="username" required autofocus></fluent-text-input>
    </div>
    <div class="field">
      <label for="loginPass">Contraseña</label>
      <fluent-text-input id="loginPass" name="password" type="password" autocomplete="current-password" required></fluent-text-input>
    </div>

    <div class="login-error hidden" id="loginError"></div>

    <fluent-button type="submit" appearance="primary" class="login-submit" id="loginSubmit">Ingresar</fluent-button>
  </form>
</main>

<script src="login.js"></script>
</body>
</html>
