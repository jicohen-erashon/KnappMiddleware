services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-knapp-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Middleware}
      POSTGRES_USER: ${POSTGRES_USER:-iadministrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - knapp_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - knapp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iadministrator} -d ${POSTGRES_DB:-Middleware}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ${RABBITMQ_CONTAINER_NAME:-knapp-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-knapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    volumes:
      - knapp_rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - knapp_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # De un solo uso, re-ejecutado en cada "up": aplica entero el repo separado de migraciones
  # (db/migrations, ver README seccion "Base de datos") contra "postgres" ya healthy. Idempotente
  # por diseno de las migraciones mismas, asi que cubre tanto el primer despliegue (volumen vacio)
  # como un redeploy sobre un volumen que ya tiene datos y le faltan migraciones nuevas — algo que
  # docker-entrypoint-initdb.d nunca resuelve (Postgres solo lo corre una vez, al crear el volumen).
  migrate:
    image: postgres:16-alpine
    container_name: ${MIGRATE_CONTAINER_NAME:-knapp-migrate}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-iadministrator}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:-Middleware}
    volumes:
      - ./apply-migrations.sh:/apply-migrations.sh:ro
      # Checkout local del repo separado de migraciones. Sin definir, monta esta carpeta vacia
      # (el script lo detecta y no falla, pero Postgres queda sin esquema).
      - ${MIGRATIONS_PATH:-./migrations}:/migrations:ro
    entrypoint: ["/bin/sh", "/apply-migrations.sh"]
    restart: "no"
    networks:
      - knapp_net

  # Seed opcional, de un solo uso: crea el primer SuperUsuario (sp_crear_usuario, 0017_usuarios_gestion.sql)
  # si ADMIN_USERNAME/ADMIN_PASSWORD vienen en .env. Idempotente: se puede re-ejecutar en cada "up"
  # sin duplicar el usuario (el script valida existencia antes del CALL). Depende de "migrate" (no solo
  # de postgres healthy) porque sp_crear_usuario no existe hasta que corre 0017_usuarios_gestion.sql.
  admin-seed:
    image: postgres:16-alpine
    container_name: ${ADMIN_SEED_CONTAINER_NAME:-knapp-admin-seed}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-iadministrator}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:-Middleware}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ROLE: ${ADMIN_ROLE:-SuperUsuario}
    volumes:
      - ./seed-admin.sh:/seed-admin.sh:ro
    entrypoint: ["/bin/sh", "/seed-admin.sh"]
    restart: "no"
    networks:
      - knapp_net

  middleware:
    build:
      # Cohen-KnappMiddleware/ vive en la raiz del repo, junto a KnappMiddleware/ (proyecto .NET) y
      # db/ (migraciones, repo aparte) — no dentro del codigo del proyecto. El contexto del build
      # tiene que ser la carpeta del .csproj; el Dockerfile queda fuera de ese contexto (BuildKit lo
      # soporta via ruta relativa que sale del contexto).
      context: ../KnappMiddleware
      dockerfile: ../Cohen-KnappMiddleware/Dockerfile
    container_name: ${MIDDLEWARE_CONTAINER_NAME:-knapp-middleware}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      # migrate (esquema) antes que admin-seed (sp_crear_usuario) antes que middleware: sin esto,
      # arrancarian en paralelo (todos dependen solo de postgres healthy) y el Gate de usuarios
      # podria cargar su snapshot vacio ANTES de que el seed inserte el admin, o el seed podria
      # correr antes de que exista sp_crear_usuario.
      migrate:
        condition: service_completed_successfully
      admin-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Unica config que vive en appsettings (el resto esta en la tabla `configuracion`, ver WireUp.cs).
      # RabbitMq/SFTP/canales KiSoft/webhook SAP se configuran despues, via POST /api/v1/config/reload
      # (hostName de RabbitMq dentro de esta red: "rabbitmq").
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-Middleware};Username=${POSTGRES_USER:-iadministrator};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
      FileLogging__BasePath: /app/logs
      # Program.cs lee esta variable antes que Loki:Endpoint de appsettings.
      __GRAFANA_LOKI_URL__: ${LOKI_ENDPOINT:-http://srv-bidev:3100}
    ports:
      - "${MIDDLEWARE_PORT:-5231}:8080"
    volumes:
      - knapp_logs:/app/logs
    networks:
      - knapp_net

volumes:
  knapp_logs:
  knapp_postgres_data:
  knapp_rabbitmq_data:

networks:
  # Red propia de este compose: nada externo (Postgres/RabbitMQ se levantan aqui mismo).
  knapp_net:
    driver: bridge
